name: ✨ Melhoria / funcionalidade
description: Sugira algo novo ou uma melhoria
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      description: Quem é afetado e em que situação.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina a solução. Mockups são bem-vindos.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] O vendedor consegue filtrar o pipeline por cidade
        - [ ] Funciona no mobile
